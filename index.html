function check(q,key){let v=q.type==='choice'?document.querySelector('input[name=ans]:checked')?.value:$('#textAnswer').value.trim();if(v===undefined||v==='')return;let ok=isCorrect(q,v);state.answers[key]={value:v,ok};state.reviewFeedback[key]={value:v,ok};if(!ok)state.mistakes[key]=(state.mistakes[key]||0)+1;if(state.mode==='mistakes'&&ok&&state.mistakes[key])state.recovered[key]=true;rememberPosition();save();render()}
function showFeedback(q,a){let f=$('#feedback');if(!f||!a)return;f.className='feedback '+(a.ok?'':'wrong');let correct=q.type==='choice'?q.choices[q.answer]:q.answers[0];let status=state.mistakes[QUESTIONS.indexOf(q)]?(state.recovered[QUESTIONS.indexOf(q)]?' <span class="status">克服済み</span>':'') : '';f.innerHTML=a.ok?`<strong>正解です。</strong>${status}<div class="small">${q.ex}</div><div class="small">見直し：本誌 p.${q.page}</div>`:`<strong>もう一度見直そう。</strong><div class="small">正答：${correct}</div><div class="small">${q.ex}</div><div class="small">見直し：本誌 p.${q.page}</div>`}
function renderSummary(list){clearInterval(state.timer);let score=list.filter(q=>state.answers[QUESTIONS.indexOf(q)]?.ok).length;if(!state.recordedThisSession){state.history.unshift({at:new Date().toLocaleString('ja-JP'),mode:modeLabel(state.mode),unit:state.unit,score,total:list.length});state.history=state.history.slice(0,30);state.recordedThisSession=true;state.resume=null;save()}$('#count').textContent=`${state.mode==='test'?'テスト':'今回の学習'} 完了`;$('#score').textContent=`${score} / ${list.length}問`;$('#bar').style.width='100%';$('#app').innerHTML=`<section class="card summary"><div class="small">今回の結果</div><strong>${score} / ${list.length}</strong><p>${score===list.length?'よくできました。':'間違えた問題は「間違えた問題」から解き直せます。'}</p><div class="actions" style="justify-content:center"><button class="btn" id="again">もう一度解く</button><button class="btn secondary" id="rankBtn">苦手ランキング</button><button class="btn secondary" id="historyBtn">学習履歴</button></div></section>`;$('#again').onclick=()=>{state.index=0;startMode();render()};$('#rankBtn').onclick=()=>{state.mode='rank';render()};$('#historyBtn').onclick=()=>{state.mode='history';render()}}
function renderRank(){let rows=Object.entries(state.mistakes).map(([key,count])=>({q:QUESTIONS[key],count,recovered:state.recovered[key]})).sort((a,b)=>b.count-a.count).slice(0,10);$('#count').textContent='苦手ランキング';$('#score').textContent=`${rows.length}問`;$('#bar').style.width='100%';$('#app').innerHTML=`<section class="card"><h2>苦手ランキング</h2><p class="small">間違えた回数が多い順です。解き直して正解すると「克服済み」になります。</p>${rows.length?`<div class="rank">${rows.map((r,i)=>`<div class="rank-row"><strong>${i+1}</strong><span>${r.q.q}<br><small>本誌 p.${r.q.page}・${r.q.unit} ${r.recovered?'<span class="status">克服済み</span>':'<span class="status pending">要復習</span>'}</small></span><b>${r.count}回</b></div>`).join('')}</div>`:'<p>まだ間違えた問題はありません。</p>'}</section>`}
function renderPageRank(){let pages={};Object.entries(state.mistakes).forEach(([key,count])=>{let q=QUESTIONS[key],p=q.page;if(!pages[p])pages[p]={page:p,unit:q.unit,wrong:0,mastered:0};pages[p].wrong+=count;if(state.recovered[key])pages[p].mastered++});let rows=Object.values(pages).sort((a,b)=>b.wrong-a.wrong);$('#count').textContent='苦手ページ';$('#score').textContent=`${rows.length}ページ`;$('#bar').style.width='100%';$('#app').innerHTML=`<section class="card"><h2>ページ別のつまずき</h2><p class="small">間違いが多い本誌ページから見直せます。「ワーク p.○○を見る」で資料も確認できます。</p>${rows.length?`<div class="rank">${rows.map(r=>`<div class="rank-row"><strong>p.${r.page}</strong><span>${r.unit}<br><small>間違い ${r.wrong}回・克服済み ${r.mastered}問</small></span><button class="btn secondary" data-page="${r.page}">資料を見る</button></div>`).join('')}</div>`:'<p>まだページ別の記録はありません。</p>'}</section>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{let q=QUESTIONS.find(x=>String(x.page)===b.dataset.page);if(q){state.mode='all';state.unit=q.unit;state.index=unitList().indexOf(q);render()}})}
function renderHistory(){let rows=state.history||[];$('#count').textContent='学習履歴';$('#score').textContent=`${rows.length}回`;$('#bar').style.width='100%';$('#app').innerHTML=`<section class="card"><h2>学習履歴</h2><p class="small">直近30回分を、この端末に保存しています。</p>${rows.length?`<div>${rows.map(r=>`<div class="history-row"><span>${r.at}<br><small>${r.mode}・${r.unit}</small></span><strong>${r.score} / ${r.total}</strong><span class="status">${Math.round(r.score/r.total*100)}%</span></div>`).join('')}</div>`:'<p>まだ学習履歴がありません。</p>'}</section>`}
render();
</script></body></html>
